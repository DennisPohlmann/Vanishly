suite: secrets
templates:
  - templates/secret.yaml
release:
  name: t
  namespace: ots
tests:
  - it: generates a rate-limit key by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: t-vanishly-rate-limit-key
      - exists:
          path: data.RATE_LIMIT_KEY

  - it: generates none with an own key in secretConfig, which goes to the chart's Secret
    set:
      secretConfig:
        RATE_LIMIT_KEY: change-me-change-me-change-me-change-me
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: t-vanishly
      - equal:
          path: stringData.RATE_LIMIT_KEY
          value: change-me-change-me-change-me-change-me

  - it: generates none with RATE_LIMIT_KEY_FILE
    set:
      config:
        RATE_LIMIT_KEY_FILE: /run/secrets/rate-limit-key
    asserts:
      - hasDocuments:
          count: 0

  - it: generates none with rateLimitKey.generate=false
    set:
      rateLimitKey:
        generate: false
    asserts:
      - hasDocuments:
          count: 0
