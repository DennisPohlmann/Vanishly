suite: settings
templates:
  - templates/configmap.yaml
  - templates/secret.yaml
release:
  name: t
  namespace: ots
capabilities:
  majorVersion: 1
  minorVersion: 33
tests:
  - it: leaves out empty settings, so the app uses its defaults
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: data
          value: {}

  - it: passes settings as strings, unknown names too
    template: templates/configmap.yaml
    set:
      config:
        MAX_VIEWS: 5
        HSTS: true
        TTL_OPTIONS: 15m,1h
        SOME_NEW_SETTING: x
    asserts:
      - equal:
          path: data
          value:
            MAX_VIEWS: "5"
            HSTS: "true"
            TTL_OPTIONS: 15m,1h
            SOME_NEW_SETTING: x

  - it: derives BASE_URL from the first ingress host
    template: templates/configmap.yaml
    set:
      ingress:
        enabled: true
        hosts:
          - host: ots.example.com
            paths:
              - path: /
    asserts:
      - equal:
          path: data.BASE_URL
          value: https://ots.example.com

  - it: keeps a BASE_URL that is set
    template: templates/configmap.yaml
    set:
      config:
        BASE_URL: https://secrets.example.com/ots
      ingress:
        enabled: true
    asserts:
      - equal:
          path: data.BASE_URL
          value: https://secrets.example.com/ots

  - it: makes no Secret by default
    template: templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: stores secretConfig and an external Redis URL in Secrets
    template: templates/secret.yaml
    set:
      secretConfig:
        CONFIRM_TEXT: hello
      redis:
        enabled: false
        external:
          url: rediss://:change-me@redis.example.com:6380
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: stringData.CONFIRM_TEXT
          value: hello
        documentIndex: 0
      - equal:
          path: metadata.name
          value: t-vanishly-redis-url
        documentIndex: 1
      - equal:
          path: stringData.redis-url
          value: rediss://:change-me@redis.example.com:6380
        documentIndex: 1
