# Default values for the Vanishly chart.
# Every key is documented in README.md (generated by helm-docs from the
# "# --" comments below) and checked by values.schema.json.

# -- Partial override of the resource names (keeps the release name).
nameOverride: ""
# -- Full override of the resource names.
fullnameOverride: ""
# -- Namespace for all resources (default: the release namespace).
namespaceOverride: ""

# -- Labels added to every resource, the pods included.
commonLabels: {}
# -- Annotations added to every resource (not to the pods; see podAnnotations).
commonAnnotations: {}

global:
  # -- Registry that replaces the registry of every image (Vanishly, Redis, init containers).
  imageRegistry: ""
  # -- Pull secrets for every pod, e.g. `[{name: regcred}]`.
  imagePullSecrets: []

image:
  # -- Image registry.
  registry: ghcr.io
  # -- Image repository.
  repository: dennispohlmann/vanishly
  # -- Image tag (default: the chart's appVersion).
  tag: ""
  # -- Image digest (`sha256:...`); wins over the tag.
  digest: ""
  # -- Pull policy.
  pullPolicy: IfNotPresent

# -- Pull secrets of the Vanishly pods, in addition to global.imagePullSecrets.
imagePullSecrets: []

# -- Pods; ignored while autoscaling.enabled. All state is in Redis, so any number works.
replicaCount: 1
# -- Old ReplicaSets kept for rollbacks.
revisionHistoryLimit: 10
# -- Deployment strategy.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0
# -- Seconds a new pod must be ready before it counts as available.
minReadySeconds: 0

# -- Labels of the Deployment.
deploymentLabels: {}
# -- Annotations of the Deployment.
deploymentAnnotations: {}
# -- Labels of the pods (in addition to commonLabels).
podLabels: {}
# -- Annotations of the pods.
podAnnotations: {}

# -- Vanishly settings as environment variables, with the names of
# docs/CONFIG.md. An empty value is left out, so the app uses its default
# (shown in the comment). Values are passed as strings; true/false and
# numbers may be written unquoted. Names not listed here are passed too,
# so settings of newer app versions work without a chart update; the app
# stops at start on an unknown or misspelt name. REDIS_URL is set from the
# redis section below. Put sensitive values into secretConfig or
# existingSecret instead.
# @default -- see values.yaml
config:
  # == Server
  # Public address, e.g. https://ots.example.com (links of /api/v1/share).
  # Empty: from the request, or the first ingress/httpRoute host with
  # https:// when baseUrlFromIngress is true.
  BASE_URL: ""
  # Listen address inside the container (0.0.0.0).
  HOST: ""
  # Listen port inside the container (3000); also the container port.
  PORT: ""
  # Reverse proxies in front: a number of hops (1), loopback, address ranges
  # (10.0.0.0/8), or false. Behind an ingress controller set it, otherwise
  # all clients share one rate limit bucket (the controller's address).
  TRUST_PROXY: ""
  # Send Strict-Transport-Security (false); only behind HTTPS.
  HSTS: ""
  # One line per request on stdout, ids replaced by :id (true).
  ACCESS_LOG: ""
  # Prefix of all Redis keys (vanishly:).
  REDIS_PREFIX: ""
  # PEM file of an own CA for a rediss:// redis.external.url (mount it with extraVolumes).
  REDIS_TLS_CA_FILE: ""
  # == Design and language
  # default, aurora, example-brand or a folder of templates.files (default).
  TEMPLATE: ""
  # auto, light or dark (the template's choice).
  DEFAULT_MODE: ""
  # Where own templates are mounted (/var/lib/vanishly/templates).
  TEMPLATES_DIR: ""
  # Languages served, e.g. en (all translations: en,de).
  LANGUAGES: ""
  # When the browser names none of LANGUAGES (en).
  DEFAULT_LANG: ""
  # Own translations (/var/lib/vanishly/translations); see the chart README.
  TRANSLATIONS_DIR: ""
  # == Expiry and views
  # Expiry dropdown, e.g. 15m,1h,1d,7d (5m,1h,1d,3d,7d up to MAX_TTL).
  TTL_OPTIONS: ""
  # Preselected expiry, e.g. 1d (1 day or the closest option).
  DEFAULT_TTL: ""
  # Longest expiry in seconds (604800, or the largest TTL_OPTIONS entry).
  MAX_TTL: ""
  # Most views per secret, 1-100 (10).
  MAX_VIEWS: ""
  # Seconds a receipt stays after its secret is gone (604800).
  RECEIPT_KEEP: ""
  # == Secret and passphrase rules
  # Longest secret in characters (10000).
  MAX_SECRET_CHARS: ""
  # Shortest secret in characters (1).
  MIN_SECRET_CHARS: ""
  # Shortest passphrase, 0 = any (0).
  MIN_PASSPHRASE_LENGTH: ""
  # upper,lower,digit,symbol or all (none).
  PASSPHRASE_COMPLEXITY: ""
  # true: every secret needs a passphrase; unless-recipients: every secret without recipients (false).
  REQUIRE_PASSPHRASE: ""
  # Wrong passphrases before the secret burns (5).
  PASSPHRASE_ATTEMPTS: ""
  # == Confirmation checkbox before "Create secret link"
  # Show the checkbox (false).
  CONFIRM_CHECKBOX: ""
  # Label in both languages (built-in text).
  CONFIRM_TEXT: ""
  # English label (CONFIRM_TEXT).
  CONFIRM_TEXT_EN: ""
  # German label (CONFIRM_TEXT).
  CONFIRM_TEXT_DE: ""
  # == "Generate" button
  # Length, 8-128 (20).
  GENERATOR_LENGTH: ""
  # upper,lower,digit,symbol or all (all).
  GENERATOR_COMPLEXITY: ""
  # == Rate limits per client IP and window; 0 switches one off
  # Creations per window (30).
  RATE_LIMIT_CREATE: ""
  # Reads per window (120).
  RATE_LIMIT_READ: ""
  # Window in seconds (600).
  RATE_LIMIT_WINDOW: ""
  # == API (true = on)
  ENABLE_API: ""
  ENABLE_API_DOCS: ""
  ENABLE_API_LINK: ""
  ENABLE_SHARE_API: ""
  ENABLE_OPEN_API: ""
  ENABLE_SECRET_META_API: ""
  ENABLE_CONFIG_API: ""
  ENABLE_ME_API: ""
  ENABLE_CREATE_API: ""
  ENABLE_REVEAL_API: ""
  ENABLE_RECEIPT_API: ""
  ENABLE_API_INDEX: ""
  # == Features (true = on)
  ENABLE_PASSPHRASE: ""
  ENABLE_VIEWS: ""
  ENABLE_RECEIPTS: ""
  ENABLE_BURN: ""
  ENABLE_VIEW_LOG: ""
  ENABLE_RECEIPT_SHARE_LINK: ""
  ENABLE_GENERATOR: ""
  ENABLE_LANG_SWITCH: ""
  ENABLE_THEME_TOGGLE: ""
  ENABLE_GITHUB_LINK: ""
  # == Sign-in and recipients (docs/CONFIG.md); needs BASE_URL
  # none, entra, keycloak, okta, auth0, google, ping, jumpcloud, cognito or oidc (none: no login, leave the rest empty).
  AUTH_PROVIDER: ""
  # Entra ID: directory (tenant) id, a GUID.
  ENTRA_TENANT_ID: ""
  # Entra ID: application (client) id, a GUID.
  ENTRA_CLIENT_ID: ""
  # ENTRA_CLIENT_SECRET is a credential: set it through secretConfig or existingSecret, not here.
  # Entra ID: file with the client secret instead (e.g. from extraVolumes).
  ENTRA_CLIENT_SECRET_FILE: ""
  # Entra ID: group search and large group lists via Microsoft Graph, needs GroupMember.Read.All (false).
  ENTRA_GRAPH: ""
  # Entra ID, national clouds only: sign-in host (https://login.microsoftonline.com).
  ENTRA_AUTHORITY: ""
  # Entra ID, national clouds only: Graph host (https://graph.microsoft.com).
  ENTRA_GRAPH_URL: ""
  # OIDC: issuer URL, e.g. https://sso.example.com/realms/main.
  OIDC_ISSUER: ""
  # OIDC: client id.
  OIDC_CLIENT_ID: ""
  # OIDC_CLIENT_SECRET is a credential: set it through secretConfig or existingSecret, not here.
  # OIDC: file with the client secret instead.
  OIDC_CLIENT_SECRET_FILE: ""
  # OIDC: space-separated scopes including openid (openid profile email).
  OIDC_SCOPES: ""
  # OIDC and presets: ID token claim with the groups (groups; cognito: cognito:groups).
  OIDC_GROUPS_CLAIM: ""
  # Only these e-mail domains sign in, e.g. example.com (any; required for google).
  AUTH_ALLOWED_DOMAINS: ""
  # Presets: people/group search in the provider's directory, see docs/providers (false).
  DIRECTORY_API: ""
  # Presets: directory API address where it differs from the issuer (Auth0 custom domain, JumpCloud EU).
  DIRECTORY_URL: ""
  # keycloak, auth0, ping: own client for the directory (the sign-in client).
  DIRECTORY_CLIENT_ID: ""
  # DIRECTORY_CLIENT_SECRET and DIRECTORY_API_TOKEN are credentials: set them through secretConfig or existingSecret, not here.
  # keycloak, auth0, ping: file with the directory client secret instead.
  DIRECTORY_CLIENT_SECRET_FILE: ""
  # okta, jumpcloud: file with the API token instead.
  DIRECTORY_API_TOKEN_FILE: ""
  # google: JSON key file of the service account (mount it with extraVolumes).
  DIRECTORY_GOOGLE_CREDENTIALS_FILE: ""
  # google: admin address the service account acts for.
  DIRECTORY_GOOGLE_ADMIN: ""
  # AUTH_SECRET (at least 32 random characters) is a credential: set it through secretConfig or existingSecret, not here.
  # File with AUTH_SECRET instead.
  AUTH_SECRET_FILE: ""
  # Seconds a sign-in lasts, 300-604800 (28800).
  AUTH_SESSION_TTL: ""
  # Who may create secrets: signed-in or anyone (signed-in).
  AUTH_CREATE: ""
  # Accept bearer tokens on the API with this audience, e.g. api://<client id> (off).
  AUTH_API_AUDIENCE: ""
  # Recipients field: off, optional or required (optional).
  RECIPIENTS: ""
  # Most recipients per secret, 1-50 (10).
  RECIPIENTS_MAX: ""
  # Groups to choose from: Name=<group id>,... or * for a search in the directory (none).
  RECIPIENT_GROUPS: ""
  # People search in the form: the group whose members are suggested, needs ENTRA_GRAPH or DIRECTORY_API (off).
  RECIPIENT_USER_GROUP: ""
  # Allowed e-mail domains of recipients, e.g. example.com,example.de (any).
  RECIPIENT_DOMAINS: ""
  # Show on the status page who opened the secret (false).
  RECEIPT_SHOW_VIEWER: ""

# -- Set BASE_URL to https://<first host> of ingress or httpRoute when config.BASE_URL is empty.
baseUrlFromIngress: true

# -- Sensitive settings (NAME: value), stored in a Secret made by the chart and passed as environment variables.
secretConfig: {}
# -- Existing Secret whose keys are passed as environment variables (envFrom), e.g. for settings you keep out of values.
existingSecret: ""
# -- Existing ConfigMap whose keys are passed as environment variables (envFrom).
existingConfigMap: ""

# -- More environment variables (list of EnvVar); they win over config. Templated with tpl.
extraEnv: []
# -- More envFrom sources (configMapRef/secretRef). Templated with tpl.
extraEnvFrom: []

# Own design templates, mounted read-only at TEMPLATES_DIR. Vanishly reads
# only plain files (no symbolic links), so files from ConfigMaps (which
# Kubernetes mounts as links) are copied into an emptyDir by an init
# container first. Pick the folder with config.TEMPLATE.
templates:
  # -- Text template files by path below TEMPLATES_DIR, e.g. `my-brand/theme.css` with the CSS as value.
  files: {}
  # -- Binary template files by path, base64 encoded (`my-brand/assets/logo.png: iVBOR...`).
  binaryFiles: {}
  # -- Existing ConfigMaps with template files; each `{name, items: [{key, path}]}` (path below TEMPLATES_DIR).
  existingConfigMaps: []
  # -- A volume source mounted directly at TEMPLATES_DIR instead (e.g. `persistentVolumeClaim: {claimName: x}`), not with files/existingConfigMaps. Its files must be plain files.
  volume: {}
  copy:
    # -- Image of the init container that copies the files (default: the Vanishly image).
    image: {}
    # -- Resources of the copy init container.
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
  # -- Size limit of the emptyDir that holds the copied files.
  sizeLimit: 32Mi

containerPort:
  # -- Name of the container port.
  name: http

# -- Container command (default: the image's).
command: []
# -- Container arguments (default: the image's).
args: []

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  privileged: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

# -- Startup probe. /healthz answers 200 when Redis accepts writes.
startupProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  timeoutSeconds: 3
  failureThreshold: 30
# -- Liveness probe; a TCP check, so a Redis outage does not restart every pod.
livenessProbe:
  enabled: true
  tcpSocket:
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
# -- Readiness probe; takes the pod out of the Service while Redis is unavailable.
readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# -- Container lifecycle hooks.
lifecycle: {}
# -- Seconds between SIGTERM and SIGKILL (Vanishly stops within 5 s).
terminationGracePeriodSeconds: 30

# -- Size limit of the emptyDir at /tmp.
tmpSizeLimit: 64Mi

# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}
# -- Topology spread constraints; an entry without labelSelector gets the pod's selector labels.
topologySpreadConstraints: []
# -- Priority class.
priorityClassName: ""
# -- Scheduler.
schedulerName: ""
# -- Runtime class (e.g. gvisor).
runtimeClassName: ""
# -- DNS policy.
dnsPolicy: ""
# -- DNS config.
dnsConfig: {}
# -- Host aliases.
hostAliases: []
# -- Service environment variables (`<SERVICE>_PORT`, ...); off, Vanishly does not use them.
enableServiceLinks: false

# -- More volumes of the pod. Templated with tpl.
extraVolumes: []
# -- More volume mounts of the Vanishly container. Templated with tpl.
extraVolumeMounts: []
# -- More init containers. Templated with tpl.
initContainers: []
# -- Sidecar containers. Templated with tpl.
extraContainers: []

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Name (default: the full name, or "default" when create is false).
  name: ""
  # -- Labels.
  labels: {}
  # -- Annotations (e.g. for workload identity).
  annotations: {}
  # -- Mount the API token; Vanishly does not talk to the Kubernetes API.
  automountServiceAccountToken: false

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 80
  # -- Port name.
  portName: http
  # -- (int) nodePort for NodePort/LoadBalancer.
  nodePort: null
  # -- Fixed cluster IP.
  clusterIP: ""
  # -- Load balancer IP (if the provider supports it).
  loadBalancerIP: ""
  # -- Allowed client ranges of a LoadBalancer.
  loadBalancerSourceRanges: []
  # -- Load balancer class.
  loadBalancerClass: ""
  # -- Local keeps the client IP for NodePort/LoadBalancer.
  externalTrafficPolicy: ""
  # -- internalTrafficPolicy.
  internalTrafficPolicy: ""
  # -- Session affinity.
  sessionAffinity: ""
  # -- IP family policy.
  ipFamilyPolicy: ""
  # -- IP families.
  ipFamilies: []
  # -- Labels.
  labels: {}
  # -- Annotations.
  annotations: {}

ingress:
  # -- Create an Ingress.
  enabled: false
  # -- Ingress class.
  className: ""
  # -- Labels.
  labels: {}
  # -- Annotations (e.g. cert-manager.io/cluster-issuer). Templated with tpl.
  annotations: {}
  # -- Hosts and their paths; `pathType` defaults to Prefix.
  hosts:
    - host: ots.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS entries (`[{secretName, hosts}]`).
  tls: []
  # -- More rules, as in an Ingress spec. Templated with tpl.
  extraRules: []

httpRoute:
  # -- Create a Gateway API HTTPRoute.
  enabled: false
  # -- Labels.
  labels: {}
  # -- Annotations.
  annotations: {}
  # -- Gateways to attach to (`[{name, namespace, sectionName}]`).
  parentRefs: []
  # -- Host names.
  hostnames:
    - ots.example.com
  # -- Rules; an empty list sends everything to the Service. Templated with tpl.
  rules: []

autoscaling:
  # -- Create a HorizontalPodAutoscaler (replaces replicaCount).
  enabled: false
  # -- Fewest pods.
  minReplicas: 2
  # -- Most pods.
  maxReplicas: 10
  # -- Target CPU use in percent of the request (null: none).
  targetCPUUtilizationPercentage: 80
  # -- (int) Target memory use in percent of the request (null: none).
  targetMemoryUtilizationPercentage: null
  # -- More metrics (autoscaling/v2).
  metrics: []
  # -- Scaling behavior.
  behavior: {}

podDisruptionBudget:
  # -- Create a PodDisruptionBudget.
  enabled: false
  # -- Pods that must stay available (number or percent); used when maxUnavailable is empty.
  minAvailable: 1
  # -- (int|string) Pods that may be down (number or percent); wins over minAvailable.
  maxUnavailable: null
  # -- IfHealthyBudget or AlwaysAllow.
  unhealthyPodEvictionPolicy: ""

networkPolicy:
  # -- Create NetworkPolicies for Vanishly and the bundled Redis.
  enabled: false
  ingress:
    # -- Who may reach Vanishly (NetworkPolicyPeer list); empty: everybody. E.g. the ingress controller's namespace.
    from: []
    # -- More ingress rules of the Vanishly pods.
    extraRules: []
  egress:
    # -- Restrict egress of the Vanishly pods to DNS and Redis (plus extraRules).
    enabled: true
    # -- Peers allowed for an external Redis (empty: any address on redis.external.port).
    externalRedisTo: []
    # -- More egress rules (e.g. to an OIDC provider).
    extraRules: []
    # -- DNS port.
    dnsPort: 53

# Redis: either the bundled Deployment (redis.enabled) or an external
# server (redis.external). Secrets are kept in memory only: no snapshots,
# no append-only file; a restart of Redis drops open secrets.
redis:
  # -- Run the bundled Redis (a single non-root Deployment). false: use redis.external.
  enabled: true
  image:
    # -- Image registry.
    registry: docker.io
    # -- Image repository.
    repository: redis
    # -- Image tag (the latest Redis 8 on Alpine, as in docker-compose.yml).
    tag: 8-alpine
    # -- Image digest (`sha256:...`); wins over the tag.
    digest: ""
    # -- Pull policy.
    pullPolicy: IfNotPresent
  auth:
    # -- Require a password (requirepass).
    enabled: true
    # -- Password; empty: a random one is made once and kept across upgrades. Only URL-safe characters.
    password: ""
    # -- Existing Secret with the password (replaces password).
    existingSecret: ""
    # -- Key of the password in existingSecret.
    existingSecretPasswordKey: redis-password
  # -- Memory limit of Redis (maxmemory); keep it below resources.limits.memory.
  maxmemory: 200mb
  # -- Eviction policy when maxmemory is reached.
  maxmemoryPolicy: volatile-ttl
  # -- More redis-server arguments, e.g. `["--loglevel", "warning"]`.
  extraArgs: []
  # -- Labels of the Deployment.
  deploymentLabels: {}
  # -- Annotations of the Deployment.
  deploymentAnnotations: {}
  # -- Labels of the pod.
  podLabels: {}
  # -- Annotations of the pod.
  podAnnotations: {}
  # -- Pod security context.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  # -- Container security context.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    privileged: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  # -- Resources.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # -- Startup probe.
  startupProbe:
    enabled: true
    exec:
      command: [sh, -c, 'redis-cli ping | grep -q PONG']
    periodSeconds: 2
    timeoutSeconds: 3
    failureThreshold: 30
  # -- Liveness probe.
  livenessProbe:
    enabled: true
    tcpSocket:
      port: redis
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # -- Readiness probe.
  readinessProbe:
    enabled: true
    exec:
      command: [sh, -c, 'redis-cli ping | grep -q PONG']
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  # -- Size limit of the in-memory /data emptyDir.
  dataSizeLimit: 64Mi
  # -- Node selector.
  nodeSelector: {}
  # -- Tolerations.
  tolerations: []
  # -- Affinity rules.
  affinity: {}
  # -- Topology spread constraints.
  topologySpreadConstraints: []
  # -- Priority class.
  priorityClassName: ""
  # -- Runtime class.
  runtimeClassName: ""
  # -- Seconds between SIGTERM and SIGKILL.
  terminationGracePeriodSeconds: 30
  # -- More environment variables of the Redis container.
  extraEnv: []
  # -- More volumes of the Redis pod.
  extraVolumes: []
  # -- More volume mounts of the Redis container.
  extraVolumeMounts: []
  # -- Sidecars of the Redis pod (e.g. an exporter).
  extraContainers: []
  service:
    # -- Port.
    port: 6379
    # -- Labels.
    labels: {}
    # -- Annotations.
    annotations: {}
  # -- Wait in an init container of the Vanishly pods until Redis answers, instead of restarting until it is up.
  waitForRedis: true
  # -- Resources of the wait init container.
  waitResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi
  external:
    # -- URL of an external Redis, e.g. rediss://:password@redis.example.com:6380. Stored in a Secret.
    url: ""
    # -- Existing Secret with the URL (replaces url).
    existingSecret: ""
    # -- Key of the URL in existingSecret.
    existingSecretUrlKey: redis-url
    # -- Port of the external Redis, for networkPolicy egress.
    port: 6379

# Overrides merged last into the rendered objects (deep merge; lists are
# replaced as a whole), for anything the values above do not cover. Keys:
# deployment, service, serviceAccount, configMap, secret, redisUrlSecret,
# templatesConfigMap, ingress, httpRoute, hpa, pdb, networkPolicy,
# redisDeployment, redisService, redisSecret, redisNetworkPolicy. Example:
#   overrides:
#     deployment:
#       spec:
#         template:
#           spec:
#             shareProcessNamespace: true
# -- Deep-merge patches of the rendered objects, by object (see the comment above).
overrides: {}

# -- More Kubernetes objects (maps or strings); templated with tpl.
extraObjects: []

tests:
  # -- Create the `helm test` pod that checks /healthz through the Service.
  enabled: true
  # -- Image of the test pod (default: the Vanishly image).
  image: {}
