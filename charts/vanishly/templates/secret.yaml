{{- define "vanishly.secret" -}}
apiVersion: v1
kind: Secret
{{ include "vanishly.metadata" (dict "context" . "name" (include "vanishly.fullname" .) "component" "app") }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretConfig }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
{{- end -}}
{{- define "vanishly.redisUrlSecret" -}}
apiVersion: v1
kind: Secret
{{ include "vanishly.metadata" (dict "context" . "name" (include "vanishly.redisUrlSecretName" .) "component" "app") }}
type: Opaque
stringData:
  redis-url: {{ .Values.redis.external.url | quote }}
{{- end -}}
{{- if .Values.secretConfig }}
---
{{ include "vanishly.render" (dict "context" . "key" "secret" "object" (include "vanishly.secret" .)) }}
{{- end }}
{{- if and (not .Values.redis.enabled) .Values.redis.external.url (not .Values.redis.external.existingSecret) }}
---
{{ include "vanishly.render" (dict "context" . "key" "redisUrlSecret" "object" (include "vanishly.redisUrlSecret" .)) }}
{{- end }}
