{{- define "vanishly.serviceaccount" -}}
apiVersion: v1
kind: ServiceAccount
{{ include "vanishly.metadata" (dict "context" . "name" (include "vanishly.serviceAccountName" .) "component" "app" "labels" .Values.serviceAccount.labels "annotations" .Values.serviceAccount.annotations) }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end -}}
{{- if .Values.serviceAccount.create }}
{{ include "vanishly.render" (dict "context" . "key" "serviceAccount" "object" (include "vanishly.serviceaccount" .)) }}
{{- end }}
