{{- define "vanishly.redis.secret" -}}
apiVersion: v1
kind: Secret
{{ include "vanishly.metadata" (dict "context" . "name" (include "vanishly.redis.fullname" .) "component" "redis") }}
type: Opaque
data:
  redis-password: {{ include "vanishly.redis.password" . | b64enc | quote }}
{{- end -}}
{{- if and .Values.redis.enabled .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
{{ include "vanishly.render" (dict "context" . "key" "redisSecret" "object" (include "vanishly.redis.secret" .)) }}
{{- end }}
