{{- define "vanishly.networkpolicy" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "vanishly.metadata" (dict "context" . "name" (include "vanishly.fullname" .) "component" "app") }}
spec:
  podSelector:
    matchLabels:
      {{- include "vanishly.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: {{ .Values.containerPort.name }}
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- include "vanishly.tplvalues" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.ingress.extraRules }}
    {{- include "vanishly.tplvalues" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # DNS
    - ports:
        - port: {{ .Values.networkPolicy.egress.dnsPort }}
          protocol: UDP
        - port: {{ .Values.networkPolicy.egress.dnsPort }}
          protocol: TCP
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "vanishly.redis.selectorLabels" . | nindent 14 }}
      ports:
        - port: redis
          protocol: TCP
    {{- else }}
    - ports:
        - port: {{ .Values.redis.external.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.egress.externalRedisTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.extraRules }}
    {{- include "vanishly.tplvalues" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end -}}
{{- if .Values.networkPolicy.enabled }}
{{ include "vanishly.render" (dict "context" . "key" "networkPolicy" "object" (include "vanishly.networkpolicy" .)) }}
{{- end }}
