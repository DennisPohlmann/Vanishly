name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go to the [security policy](https://github.com/DennisPohlmann/Vanishly/security/policy), not here.
        **Never paste a real secret link, key, passphrase, API token, IP address or audit log entry.** Replace them with made-up values.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the footer, or the image tag.
      placeholder: 1.5.3
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Docker Compose
        - Helm chart
        - tar.gz with systemd
        - npm start (development)
        - other
    validations:
      required: true
  - type: input
    id: auth
    attributes:
      label: Sign-in provider (AUTH_PROVIDER)
      placeholder: none, entra, keycloak, oidc, ...
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 140 on Windows 11
  - type: textarea
    id: config
    attributes:
      label: Relevant settings and logs
      description: Only the settings that matter, without secrets (SESSION_SECRET, client secrets, Redis passwords).
      render: shell
