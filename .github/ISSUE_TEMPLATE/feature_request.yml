name: Feature request
description: An idea for something Vanishly should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that does not work today, and who needs it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could it work? Settings, pages, API.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other ways you considered.
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: The idea keeps the key and the plaintext out of the server (end-to-end encryption).
