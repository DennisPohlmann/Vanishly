name: Accessibility problem
description: Something is hard or impossible to use with a keyboard, screen reader, zoom or other assistive technology.
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: |
        Vanishly aims at WCAG 2.2 AA ([accessibility statement](https://github.com/DennisPohlmann/Vanishly/blob/main/docs/ACCESSIBILITY.md)). Thank you for telling us where it falls short.
        Never paste a real secret link, key or passphrase.
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: create form, reveal, status page, API tokens, admin ...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: What did you try, what happened, what would you expect?
    validations:
      required: true
  - type: input
    id: at
    attributes:
      label: Assistive technology, browser and operating system
      placeholder: NVDA 2025.1, Firefox, Windows 11
  - type: input
    id: template
    attributes:
      label: Template and mode
      placeholder: default, dark
