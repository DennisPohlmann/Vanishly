name: build

# Every push (any branch) and every pull request runs everything a release
# would run, without publishing anything: check (type check, npm audit,
# tests, OpenAPI lint, accessibility), image-scan (Dockerfile, repository,
# Redis image, builds the image and scans it with Trivy) and package (the
# tar.gz as a workflow artifact, kept 7 days). chart.yml checks and packages
# the Helm chart on the same events. A broken build shows up as a red run
# right away, not at release time. Once a week (schedule) the same checks
# run on main, to catch new vulnerabilities without a commit.
#
# A release is only made when Dennis starts it: Actions -> build ->
# "Run workflow" on main with "release" ticked, or
#   gh workflow run build.yml --ref main -f release=true
# semantic-release then reads the Conventional Commits since the last tag:
# for a feat, fix or breaking change it bumps the version files, writes
# CHANGELOG.md, commits that as "chore(release): vX.Y.Z [skip ci]", tags
# vX.Y.Z and creates the GitHub release as a draft; package and image then
# build that tag, add the archive and the SBOM to the draft and push the
# image tags <version>, <major>.<minor> and latest, chart pushes the Helm
# chart to oci://ghcr.io/<owner>/charts/vanishly, and publish-release
# publishes it. The draft is needed because releases are immutable: once
# published, no asset can be added. Every release run also pushes edge
# (main at that moment), even when there are no release commits.
# A manual run without "release" only checks and builds.
# Security checks on every run: npm audit, Trivy over the repository
# (secrets, lock file, misconfigurations), the Dockerfile, the built image
# and the Redis image; CodeQL runs in codeql.yml.
on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (semantic-release) and publish image, chart and archive; only on main
        type: boolean
        default: false

permissions:
  contents: read

env:
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  IMAGE: ghcr.io/${{ github.repository_owner }}/vanishly

jobs:
  check:
    runs-on: ubuntu-26.04
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: whitespace (git diff --check)
        run: git diff --check "$(git hash-object -t tree /dev/null)"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run vendor
      - name: type check
        run: npm run lint
      - name: known vulnerabilities in the production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: tests
        run: npm test
        env:
          REDIS_URL: redis://localhost:6379
      - name: OpenAPI document
        run: npx --yes @redocly/cli@2.82.0 lint --extends=minimal openapi/openapi.json
      # WCAG 2.2 AA (axe-core) of every page and state, all built-in
      # templates, light and dark, desktop and 320 px phone.
      - name: accessibility
        run: |
          npx playwright install --with-deps chromium
          npm run test:a11y
        env:
          REDIS_URL: redis://localhost:6379

  # The client libraries and the command line client (clients/): each one
  # against the shared test vectors of public/js/vanishly-crypto.js, with
  # the toolchain of its language. tests/clients.test.js (job check) checks
  # that the vectors and the versions are current.
  clients:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: clients/go/go.sum
      - name: Go (library and command line client)
        working-directory: clients/go
        run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...

  # Builds the image without pushing it and scans it: HIGH or CRITICAL
  # vulnerabilities that have a fix fail, and so do HIGH or CRITICAL
  # misconfigurations of the Dockerfile. Findings accepted on purpose go into
  # .trivyignore with a reason and an expiry date.
  image-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-trivy
      - name: scan the Dockerfile
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .
      # Committed secrets (keys, tokens, passwords), vulnerable packages in
      # package-lock.json and misconfigurations, over the whole checkout.
      - name: scan the repository (secrets, dependencies, config)
        run: >-
          trivy fs --scanners vuln,secret,misconfig --skip-dirs node_modules
          --severity HIGH,CRITICAL --exit-code 1 .
      # The Redis image of the Compose files is part of what users run.
      - name: scan the Redis image of docker-compose/standalone/docker-compose.yml
        run: |
          redis=$(sed -n 's/^ *image: *\(redis:[^ ]*\).*/\1/p' docker-compose/standalone/docker-compose.yml)
          trivy image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 "$redis"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: vanishly:scan
          cache-from: type=gha
      - name: scan the image
        run: >-
          trivy image --scanners vuln --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1 vanishly:scan

  # Only on a manual run with release=true. semantic-release releases only
  # from main (.releaserc.json), so a run on another branch fails here
  # instead of silently doing nothing.
  release:
    needs: [check, image-scan, clients]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: releases only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release can only be started on main (this run: $GITHUB_REF_NAME)."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          npx --yes
          -p semantic-release@26.0.1
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@10.4.1
          semantic-release
      # go get needs a tag with the module's folder: clients/go/vX.Y.Z.
      - name: tag the Go module
        if: steps.release.outputs.version != ''
        env:
          V: ${{ steps.release.outputs.version }}
        run: |
          git fetch --tags origin
          git tag "clients/go/v$V" "v$V"
          git push origin "clients/go/v$V"

  # Runs on every run, after the release job if there is one, and builds the
  # new tag if there was a release, otherwise the pushed commit. The archive
  # is a workflow artifact (7 days); only a release attaches it to the
  # GitHub release.
  package:
    needs: [check, image-scan, clients, release]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.image-scan.result == 'success' && needs.clients.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write # keyless Sigstore signatures of the command line clients
      attestations: write # their build provenance
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install -g npm@latest
      - name: make package
        run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: vanishly
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: add the archive to the release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$RELEASE" dist/*.tar.gz dist/*.tar.gz.sha256 --repo "$GITHUB_REPOSITORY"
      # The command line clients with the Dockerfile's stage "clients": the
      # same recipe and version as the image, so the image's /downloads has
      # the same bytes (job image checks it). The checksum files have the
      # format the server makes (src/downloads.js).
      - uses: docker/setup-buildx-action@v4
      - name: build the command line clients
        env:
          VERSION: ${{ env.RELEASE || format('edge+{0}', github.sha) }}
        run: |
          docker buildx build --target clients --build-arg VERSION="$VERSION" --output type=local,dest=dist/clients .
          cd dist/clients
          python3 - <<'PY'
          import hashlib, os
          names = sorted(n for n in os.listdir('.') if n.startswith('vanishly-'))
          for algo, file in [('sha256', 'SHA256SUMS'), ('sha512', 'SHA512SUMS'), ('sha3_256', 'SHA3-256SUMS'), ('sha3_512', 'SHA3-512SUMS'), ('blake2b', 'B2SUMS')]:
              with open(file, 'w') as out:
                  for n in names:
                      out.write(f"{hashlib.new(algo, open(n, 'rb').read()).hexdigest()}  {n}\n")
          PY
          sha256sum -c SHA256SUMS && b2sum -c B2SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: vanishly-clients
          path: dist/clients/*
          if-no-files-found: error
          retention-days: 7
      # Release only: keyless signatures (a .sigstore.json bundle per file,
      # identity: this workflow) and GitHub artifact attestations (SLSA build
      # provenance), checked with cosign verify-blob or gh attestation verify
      # (docs/CLIENTS.md).
      - uses: sigstore/cosign-installer@v3
        if: env.RELEASE != ''
      - name: sign the command line clients
        if: env.RELEASE != ''
        run: |
          cd dist/clients
          for f in vanishly-* *SUMS; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - uses: actions/attest-build-provenance@v4
        if: env.RELEASE != ''
        with:
          subject-path: |
            dist/clients/vanishly-*
            dist/clients/*SUMS
      - name: add the command line clients to the release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$RELEASE" dist/clients/* --repo "$GITHUB_REPOSITORY"

  # Publishes the image, only in a manual release run (image-scan has
  # already built and scanned it on every push): edge always, and for a new
  # version <version>, <major>.<minor> and latest, with an SBOM and full
  # provenance as attestations; a release also gets the SBOM as an SPDX file.
  image:
    needs: [check, image-scan, release, package]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write # the SBOM file in the release
      packages: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=v${{ env.RELEASE }},enable=${{ env.RELEASE != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.RELEASE }},enable=${{ env.RELEASE != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE != '' }}
          flavor: latest=false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE || format('edge+{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Reproducible builds: the clients the image serves on /downloads are
      # byte for byte the ones signed for the release.
      - uses: actions/download-artifact@v8
        if: env.RELEASE != ''
        with:
          name: vanishly-clients
          path: signed
      - name: the clients in the image are the signed ones
        if: env.RELEASE != ''
        run: |
          docker pull "${IMAGE,,}:$RELEASE"
          id=$(docker create "${IMAGE,,}:$RELEASE")
          docker cp "$id:/app/downloads" from-image
          docker rm "$id"
          cd from-image && sha256sum -c ../signed/SHA256SUMS && sha512sum -c ../signed/SHA512SUMS
      - uses: ./.github/actions/setup-trivy
        if: env.RELEASE != ''
      - name: add the SBOM to the release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          sbom="dist/vanishly-$RELEASE-image.spdx.json"
          mkdir -p dist
          trivy image --format spdx-json --output "$sbom" "${IMAGE,,}:$RELEASE"
          gh release upload "v$RELEASE" "$sbom" --repo "$GITHUB_REPOSITORY"

  # The Helm chart of the release: chart.yml checks it, pushes it to
  # oci://ghcr.io/<owner>/charts/vanishly and adds the .tgz to the draft.
  # After image, so the image tag the chart points to exists.
  chart:
    needs: [release, image]
    if: ${{ !cancelled() && needs.release.outputs.version != '' && needs.image.result == 'success' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/chart.yml
    with:
      release: ${{ needs.release.outputs.version }}

  # Publishes the draft release once the archive and the SBOM are attached.
  # Releases are immutable, so this has to come last.
  publish-release:
    needs: [release, package, image, chart]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$RELEASE" --draft=false --latest --repo "$GITHUB_REPOSITORY"
