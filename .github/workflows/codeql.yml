name: codeql

# Static analysis of the JavaScript (server, browser code, tests) with
# GitHub CodeQL, "security-extended" queries. Findings appear in the
# Security tab (code scanning). Runs on every push and pull request to main
# and once a week, because new queries arrive without a change here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
