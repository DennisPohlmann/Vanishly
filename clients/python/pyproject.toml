[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vanishly"
version = "4.0.0"
description = "Client for Vanishly: end-to-end encrypted one-time secrets, the whole API and a command line tool"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = ["cryptography>=42"]
keywords = ["secrets", "one-time", "end-to-end encryption", "vanishly"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/DennisPohlmann/vanishly"
Documentation = "https://github.com/DennisPohlmann/vanishly/blob/main/docs/CLIENTS.md"

[project.scripts]
vanishly = "vanishly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
