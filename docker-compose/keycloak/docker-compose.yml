# Vanishly with sign-in through Keycloak: an example to try sign-in,
# recipients, responsible groups, the protected status page and the people
# search on your own machine. Demo users and plain http: NOT for a server.
#
#   cp .env.example .env; cp keycloak.env.example keycloak.env
#                             # then set real values, see README.md
#   docker compose up -d      # or: podman-compose up -d
#   open http://localhost:3000 and sign in as alice, bob or carol
#   docker compose down
#
# Vanishly runs in Keycloak's network (network_mode below), so the browser
# and Vanishly both reach Keycloak as http://localhost:<KEYCLOAK_PORT>,
# which the sign-in needs. Inside, both use the same ports as outside.
# All settings are in .env; your own docker-compose.override.yml can add environment:, which wins (docs/INSTALLATION.md).
name: vanishly-keycloak-example

x-podman:
  in_pod: false

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm", "--http-port=${KEYCLOAK_PORT:-8080}"]
    # Its passwords, in a file of its own: Vanishly does not get them.
    env_file: keycloak.env
    # From .env, which Compose reads for the ${...} in this file: Keycloak gets
    # what it shares with Vanishly, not the whole file.
    environment:
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      # Filled into realm-vanishly.json on import.
      VANISHLY_URL: ${BASE_URL:?set BASE_URL in .env}
      KC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      KC_DIRECTORY_CLIENT_SECRET: ${DIRECTORY_CLIENT_SECRET:?set DIRECTORY_CLIENT_SECRET in .env}
    volumes:
      - ./realm-vanishly.json:/opt/keycloak/data/import/realm-vanishly.json:ro
    ports:
      # Vanishly shares this container's network, so its port is published here.
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:${KEYCLOAK_PORT:-8080}"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    user: "999:1000"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    read_only: true
    tmpfs:
      - /data:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  vanishly:
    image: ${VANISHLY_IMAGE:-ghcr.io/dennispohlmann/vanishly:latest}
    network_mode: "service:keycloak"
    depends_on: [keycloak, redis]
    restart: unless-stopped
    # All its settings, also the addresses of Redis and Keycloak.
    env_file: .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
