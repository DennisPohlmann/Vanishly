# Try the sign-in without Entra ID: a local test login server where you can
# sign in as anybody. ONLY FOR TESTS on your own machine, never on a server.
#
#   cd docker-compose/standalone
#   docker compose -f docker-compose.yml -f docker-compose.auth-test.yml up -d
#
# For a real login server with users and groups see ../keycloak/.
#
# Open http://localhost:3000, click "Sign in". On the test server's page type
# any user name, and as claims e.g.
#   {"email": "alice@example.com", "name": "Alice", "groups": ["ops"]}
# Sign in as a second person in a private window to try a restricted secret.
# docs/INSTALLATION.md ("Sign-in") explains it.
services:
  oidc-test:
    # navikt/mock-oauth2-server: an OpenID provider for tests (MIT).
    image: ghcr.io/navikt/mock-oauth2-server:6.1.4
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
    # Vanishly runs in this container's network (below), so both the browser
    # and Vanishly reach the test server as http://localhost:8080.
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8080:8080"

  vanishly:
    network_mode: "service:oidc-test"
    ports: !reset []
    depends_on:
      oidc-test:
        condition: service_started
    environment:
      BASE_URL: http://localhost:3000
      AUTH_PROVIDER: oidc
      OIDC_ISSUER: http://localhost:8080/default
      OIDC_CLIENT_ID: vanishly
      OIDC_CLIENT_SECRET: change-me-test-only
      AUTH_SECRET: change-me-test-only-0123456789abcdef
      RECIPIENT_GROUPS: Ops=ops,Developers=dev
      RECEIPT_SHOW_VIEWER: "true"
