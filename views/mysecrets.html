<section class="card card-wide" id="mysecrets-card">
  <h1>{{ t:mine.title }}</h1>
  <p class="lead">{{ t:mine.intro }}</p>
  <form id="secrets-filter" class="filter-grid" autocomplete="off">
    <div class="field"><label for="s-status">{{ t:secrets.f.status }}</label>
      <select id="s-status" name="status"><option value="">{{ t:admin.any }}</option><option value="open">{{ t:secrets.status.open }}</option><option value="partly_opened">{{ t:secrets.status.partly_opened }}</option><option value="opened">{{ t:secrets.status.opened }}</option><option value="expired">{{ t:secrets.status.expired }}</option><option value="burned">{{ t:secrets.status.burned }}</option></select></div>
    <div class="field"><label for="s-from">{{ t:admin.f.from }}</label><input type="datetime-local" id="s-from" name="from"></div>
    <div class="filter-actions"><button type="submit" class="btn btn-primary">{{ t:admin.apply }}</button></div>
  </form>
  <p class="notice notice-error" id="secrets-error" role="alert" hidden></p>
  <p class="hint" id="secrets-count" role="status"></p>
  <div class="table-wrap">
    <table class="data">
      <thead><tr><th scope="col">{{ t:secrets.col.created }}</th><th scope="col">{{ t:secrets.col.creator }}</th><th scope="col">{{ t:secrets.col.for }}</th><th scope="col">{{ t:secrets.col.comment }}</th><th scope="col">{{ t:secrets.col.expires }}</th><th scope="col">{{ t:secrets.col.status }}</th><th scope="col">{{ t:secrets.col.opened }}</th><th scope="col">{{ t:secrets.col.ref }}</th></tr></thead>
      <tbody id="secrets-rows"></tbody>
    </table>
  </div>
</section>
