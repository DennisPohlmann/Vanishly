<section class="card" id="reveal-card" data-id="{{ id }}" data-passphrase="{{ passphrase }}" data-locked="{{ locked }}">
  <h1>{{ t:reveal.title }}</h1>
  <p class="lead">{{ intro }}</p>
  <div id="locked" hidden>
    <p class="notice notice-error" id="locked-text">{{ lockedText }}</p>
    <a class="btn btn-primary btn-block" id="locked-login" data-login href="/auth/login?return=/s/{{ id }}">{{ t:auth.button }}</a>
    <form id="locked-switch" method="post" action="/auth/logout" data-login>
      <input type="hidden" name="return" value="/s/{{ id }}">
      <button type="submit" class="btn btn-block">{{ t:reveal.switchAccount }}</button>
    </form>
  </div>
  <form id="reveal-form" autocomplete="off">
    <div class="field" id="passphrase-field" hidden>
      <label for="reveal-passphrase">{{ t:reveal.passphrase }}</label>
      <input type="password" id="reveal-passphrase" maxlength="1000" autocomplete="off">
    </div>
    <p class="notice notice-error" id="reveal-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary btn-block" id="reveal-submit">{{ t:reveal.button }}</button>
  </form>
  <div id="revealed" hidden>
    <p class="notice notice-ok" id="revealed-info" role="status"></p>
    <label for="revealed-secret" class="sr-only">{{ t:reveal.secretLabel }}</label>
    <textarea id="revealed-secret" rows="7" readonly spellcheck="false"></textarea>
    <button type="button" class="btn btn-primary btn-block" data-copy="revealed-secret">{{ t:created.copy }}</button>
  </div>
</section>
