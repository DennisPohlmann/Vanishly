<section class="card" id="password-card">
  <h1>{{ t:local.passwordTitle }}</h1>
  {{{ notice }}}
  <form method="post" action="/settings/password">
    <input type="email" name="user" autocomplete="username" value="{{ user }}" readonly hidden>
    <div class="field"><label for="pw-current">{{ t:local.currentPassword }}</label><input type="password" id="pw-current" name="current" maxlength="1024" autocomplete="current-password" required></div>
    <div class="field"><label for="pw-new">{{ t:local.newPassword }}</label><input type="password" id="pw-new" name="password" minlength="{{ minLength }}" maxlength="1024" autocomplete="new-password" required aria-describedby="pw-hint"><div class="hint" id="pw-hint">{{ hint }}</div></div>
    <div class="field"><label for="pw-repeat">{{ t:local.repeatPassword }}</label><input type="password" id="pw-repeat" name="repeat" maxlength="1024" autocomplete="new-password" required></div>
    <button type="submit" class="btn btn-primary btn-block">{{ t:local.changePassword }}</button>
  </form>
</section>
